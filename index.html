const Q=[['Always balance atoms of every element; never change a formula, only coefficients.','Why must a chemical equation be balanced?','Mass is neither created nor destroyed (law of conservation of mass), so atoms on both sides must be equal.'],['pH below 7 is acid, above 7 is base; each unit is a 10× change in [H⁺].','Write the formula and one use of baking soda.','NaHCO₃; used in antacids and for baking (releases CO₂).'],['Remember the reactivity series: K, Na, Ca, Mg, Al, Zn, Fe, Pb, H, Cu, Ag, Au.','Why does zinc displace copper from CuSO₄ solution?','Zinc is more reactive than copper, so it replaces copper from its salt.'],['Carbon forms covalent bonds because it has 4 valence electrons and cannot easily gain or lose them.','Name the functional group in ethanol and ethanoic acid.','Ethanol: alcohol (–OH). Ethanoic acid: carboxylic acid (–COOH).'],['Learn labelled diagrams: nephron, heart, stomata, alimentary canal.','What are the raw materials for photosynthesis?','Carbon dioxide, water and sunlight, with chlorophyll as the pigment.'],['Reflex arc is the shortest path: receptor → sensory neuron → spinal cord → motor neuron → effector.','Name two plant hormones and one function each.','Auxin: cell elongation and phototropism. Gibberellin: stem growth.'],['Differentiate clearly: pollination vs fertilisation; budding vs fragmentation.','Name two methods of asexual reproduction.','Binary fission (Amoeba) and budding (Hydra).'],['In a monohybrid cross of Tt × Tt the phenotypic ratio is 3:1 and genotypic ratio 1:2:1.','Why are acquired traits not inherited?','They change only body cells, not the DNA of germ cells.'],['Use the sign convention: measure from the pole, direction of incident light is positive.','A lens has f = 20 cm. Find its power.','P = 1/f = 1/0.2 = +5 D (convex lens).'],['Myopia needs a concave lens; hypermetropia needs a convex lens.','Why does the sky look blue?','Shorter wavelengths scatter more strongly in the atmosphere than red light.'],['Series: same current. Parallel: same potential difference.','A 10 Ω resistor draws 2 A. Find V and power.','V = IR = 20 V; P = VI = 40 W.'],['Fleming\'s left-hand rule is for motors; right-hand rule is for generators.','What does a fuse do?','It melts when current is too high, breaking the circuit and preventing damage.'],['Only about 10% of energy passes to the next trophic level.','Name one effect of ozone depletion.','More UV radiation reaches Earth, causing skin cancer and cataract.']];

function bal(w){const R=[{n:'H₂ + O₂ → H₂O',r:[{H:2},{O:2}],p:[{H:2,O:1}],a:[2,1,2]},{n:'Fe + O₂ → Fe₂O₃',r:[{Fe:1},{O:2}],p:[{Fe:2,O:3}],a:[4,3,2]},{n:'CH₄ + O₂ → CO₂ + H₂O',r:[{C:1,H:4},{O:2}],p:[{C:1,O:2},{H:2,O:1}],a:[1,2,1,2]},{n:'N₂ + H₂ → NH₃',r:[{N:2},{H:2}],p:[{N:1,H:3}],a:[1,3,2]}];
 w.innerHTML='<b>⚖ Balance the equation</b><p class="mu">Change coefficients until atoms match on both sides.</p>';const s=ctrl(w,'<select></select>'),o=H('<div></div>');w.append(o);const sel=$('select',s);R.forEach((r,i)=>sel.add(new Option(r.n,i)));
 let k,co;function init(){k=R[sel.value];co=k.r.concat(k.p).map(()=>1);draw()}

const S=[`Writing equations|Reactants on the left, products on the right; add state symbols (s), (l), (g), (aq).|Word equation>Formula equation>Balanced equation
Balancing method|Balance atom by atom with hit and trial; start with the most complex formula, leave O and H for last.|Count atoms>Add coefficients>Recount
Combination reactions|Two or more reactants form one product, e.g. CaO + H₂O → Ca(OH)₂ (exothermic).|A + B>AB
Decomposition|One reactant splits into simpler products by heat, light or electricity, e.g. 2AgCl → 2Ag + Cl₂.|AB>A + B
Displacement|A more reactive element displaces a less reactive one from its compound.|Reactive metal>Salt solution>Displaced metal
Double displacement|Ions swap partners, often giving a precipitate: BaCl₂ + Na₂SO₄ → BaSO₄↓ + 2NaCl.|AB + CD>Ion exchange>AD + CB

Exo and endothermic|Exothermic reactions release heat (respiration); endothermic ones absorb it (photosynthesis).|Energy>Released: exothermic>Absorbed: endothermic
Corrosion & rancidity|Rusting of iron and oxidation of fats; prevent by painting, antioxidants, nitrogen flushing.|Oxygen + moisture>Rust or rancid>Prevention`,`Properties of acids|Acids taste sour, turn blue litmus red and react with metals to give H₂ gas.|Acid + metal>Salt>H₂ gas
Properties of bases|Bases feel soapy and turn red litmus blue; alkalis are water-soluble bases.|Base>Red litmus>Turns blue
Indicators|Litmus, phenolphthalein, methyl orange and olfactory indicators change colour in acid or base.|Indicator>Add acid or base>Colour change
Neutralisation|Acid + base → salt + water, e.g. HCl + NaOH → NaCl + H₂O.|Acid>Base>Salt + water
Acid-carbonate reactions|Carbonates give salt, CO₂ and water; CO₂ turns lime water milky.|Carbonate + acid>CO₂>Lime water milky
Strength and pH|Strong acids ionise fully (HCl), weak ones partly (CH₃COOH); universal indicator shows pH.|Dilution>H⁺ falls>pH rises
pH in daily life|Tooth decay starts below pH 5.5; antacids relieve acidity; soil pH affects crops.|Acid in mouth>Enamel attacked>Use toothpaste

Occurrence|Minerals, ores and gangue; metals occur native or as oxides, sulphides, carbonates.|Mineral>Ore>Gangue removal

const X={'0.1':[`A chemical equation is the shorthand description of a chemical reaction, written with symbols and formulae.`,`Substances that react (reactants) go on the left and substances formed (products) go on the right, joined by an arrow showing the direction. State symbols (s) solid, (l) liquid, (g) gas and (aq) aqueous tell the physical state; heat, light or a catalyst is written above the arrow. A word equation uses names; a formula equation uses formulae and may still be unbalanced.`,`Zinc + sulphuric acid → zinc sulphate + hydrogen becomes Zn(s) + H₂SO₄(aq) → ZnSO₄(aq) + H₂(g).`,`Write correct formulae first (H₂O, not HO). Balancing changes only coefficients, never subscripts.`],'0.2':[`Balancing makes the number of atoms of every element equal on both sides, because matter is neither created nor destroyed (law of conservation of mass).`,`Steps: 1) write the skeleton equation; 2) list atoms on both sides; 3) start with the element in the most complex formula and add a coefficient; 4) balance the remaining elements, leaving H and O for last; 5) recount every element; 6) add state symbols. Use the smallest whole-number coefficients.`,`Fe + H₂O → Fe₃O₄ + H₂ balances as 3Fe + 4H₂O → Fe₃O₄ + 4H₂.`,`Do not stop after one pass: recount all elements, and reduce coefficients if all are divisible by a common number.`],'0.3':[`In a combination reaction, two or more substances combine to form a single product.`,`Many combination reactions are exothermic. Quick lime reacts vigorously with water to give slaked lime and a lot of heat. Slaked lime on walls slowly absorbs CO₂ to form a shiny layer of CaCO₃, which is why whitewashing gives a glow after two or three days.`,`CaO(s) + H₂O(l) → Ca(OH)₂(aq) + heat; C(s) + O₂(g) → CO₂(g); 2H₂(g) + O₂(g) → 2H₂O(l).`,`Combination reactions need not involve oxygen: NH₃ + HCl → NH₄Cl is also a combination.`],'0.4':[`A decomposition reaction is one in which a single compound breaks into two or more simpler substances.`,`It needs energy as heat (thermal), electricity (electrolytic) or light (photolytic). Heating lead nitrate gives brown NO₂ fumes; silver chloride turns grey in sunlight, which is used in black-and-white photography. Electrolysis of water gives hydrogen at the cathode and oxygen at the anode in a 2:1 volume ratio.`,`CaCO₃(s) → CaO(s) + CO₂(g) on heating; 2H₂O(l) → 2H₂(g) + O₂(g) with electricity.`,`Decomposition reactions are mostly endothermic, since they absorb energy.`],'0.5':[`A displacement reaction is one in which a more reactive element displaces a less reactive element from its compound.`,`The reactivity series decides the outcome. When an iron nail is placed in copper sulphate solution, the blue colour fades and a reddish-brown deposit of copper forms on the nail. A less reactive metal cannot displace a more reactive one, so copper placed in zinc sulphate shows no change.`,`Fe(s) + CuSO₄(aq) → FeSO₄(aq) + Cu(s); Zn(s) + 2HCl(aq) → ZnCl₂(aq) + H₂(g).`,`Always check the reactivity series first before predicting whether a reaction will happen.`],'0.6':[`In a double displacement reaction, two compounds exchange their ions to form two new compounds.`,`It usually occurs in solution, and often one product is an insoluble solid called a precipitate (it is then called a precipitation reaction). Neutralisation of an acid by a base is also a double displacement reaction.`,`Na₂SO₄(aq) + BaCl₂(aq) → BaSO₄(s) + 2NaCl(aq), where BaSO₄ is a white precipitate.`,`Single displacement involves an element and a compound; double displacement involves two compounds.`],'0.7':[`Oxidation is the gain of oxygen or loss of hydrogen (or electrons); reduction is the loss of oxygen or gain of hydrogen (or electrons).`,`Both always occur together, so the reaction is called a redox reaction. The substance oxidised is the reducing agent and the substance reduced is the oxidising agent. Heating copper in air forms black copper oxide (oxidation); passing hydrogen over hot copper oxide gives brown copper back (reduction).`,`CuO + H₂ → Cu + H₂O: CuO is reduced, and H₂ is oxidised.`,`The oxidising agent is the substance that is itself reduced; many students reverse this.`],'0.8':[`Exothermic reactions release heat energy; endothermic reactions absorb heat energy.`,`Exothermic: burning of natural gas, respiration, decomposition of vegetable matter into compost, slaking of lime. Endothermic: photosynthesis, thermal decomposition of calcium carbonate, electrolysis of water. A test tube feels hot in an exothermic reaction and cold in an endothermic one.`,`CH₄ + 2O₂ → CO₂ + 2H₂O + heat; 6CO₂ + 6H₂O + sunlight → C₆H₁₂O₆ + 6O₂.`,`Respiration is exothermic, even though it happens inside the body.`],'0.9':[`Corrosion is the gradual eating away of a metal by air, moisture or chemicals; rancidity is the oxidation of fats and oils in food, producing bad smell and taste.`,`Rusting of iron needs both oxygen and moisture. Silver tarnishes black (Ag₂S) and copper turns green. Prevent corrosion by painting, oiling, galvanising (zinc coating) or alloying. Prevent rancidity with antioxidants, air-tight containers, refrigeration, and by flushing chips packets with nitrogen.`,`Galvanised iron pipes; nitrogen-filled packets of chips.`,`Iron does not rust in dry air or in boiled water: both air and water are needed.`],'1.1':[`An acid is a substance that produces hydrogen ions (H⁺) when dissolved in water.`,`Acids taste sour, turn blue litmus red and react with active metals to release hydrogen: Zn + 2HCl → ZnCl₂ + H₂. Hydrogen burns with a pop sound near a flame. Mineral acids are HCl, H₂SO₄ and HNO₃; organic acids include acetic, citric and lactic acid. Dry HCl gas shows no acidic behaviour because H⁺ forms only in water.`,`Pass hydrogen into soap solution, and a burning candle near the bubbles gives a pop sound.`,`Acids conduct electricity only in aqueous solution; never taste chemicals in the lab.`],'1.2':[`A base is a substance that produces hydroxide ions (OH⁻) in water; a base soluble in water is called an alkali.`,`Bases taste bitter, feel soapy, turn red litmus blue and phenolphthalein pink. Zinc reacts with NaOH to give hydrogen: Zn + 2NaOH → Na₂ZnO₂ + H₂. Dissolving NaOH in water releases a lot of heat.`,`NaOH, KOH and Ca(OH)₂ are alkalis; Cu(OH)₂ is a base but not an alkali.`,`All alkalis are bases but not all bases are alkalis.`],'1.3':[`Indicators are substances that show different colours in acidic and basic solutions.`,`Natural: litmus (red in acid, blue in base), turmeric (turns red in base), red cabbage. Synthetic: phenolphthalein (colourless in acid, pink in base) and methyl orange (red in acid, yellow in base). Olfactory indicators (onion, vanilla, clove oil) lose their smell in a base. Universal indicator shows a range of colours that matches pH.`,`Phenolphthalein is pink in NaOH and colourless in HCl.`,`Methyl orange: red in acid, yellow in base; students often swap them.`],'1.4':[`Neutralisation is the reaction of an acid with a base to give salt and water.`,`H⁺ from the acid combines with OH⁻ from the base to form water, and heat is released. Uses: antacids (magnesium hydroxide) for stomach acidity, baking soda for bee stings, lime for acidic soil, and vinegar for wasp stings.`,`NaOH + HCl → NaCl + H₂O; Mg(OH)₂ + 2HCl → MgCl₂ + 2H₂O.`,`A bee sting is acidic and a wasp sting is basic; remember which neutraliser to use.`],'1.5':[`Metal carbonates and hydrogencarbonates react with acids to give a salt, carbon dioxide and water.`,`Test CO₂ by passing it through lime water, which turns milky because of CaCO₃. Excess CO₂ makes the milkiness disappear as soluble calcium hydrogencarbonate forms. This is why acid rain damages marble.`,`Na₂CO₃ + 2HCl → 2NaCl + H₂O + CO₂; NaHCO₃ + HCl → NaCl + H₂O + CO₂.`,`Write both observations in lime-water answers: first milky, then clear with excess CO₂.`],'1.6':[`pH is a scale from 0 to 14 that measures hydrogen ion concentration: below 7 acidic, 7 neutral, above 7 basic.`,`Each pH unit is a tenfold change in H⁺ concentration. Strong acids (HCl) ionise completely; weak acids (CH₃COOH) ionise partly. Diluting an acid raises its pH and diluting a base lowers it. Check pH using pH paper or universal indicator.`,`Lemon juice ≈ 2, pure water 7, blood ≈ 7.4, NaOH ≈ 14.`,`Dilution brings pH close to 7 but never beyond it.`],'1.7':[`pH matters in the body, in agriculture and in daily life.`,`The body works at pH 7.0 to 7.8. Tooth decay starts when mouth pH drops below 5.5 as bacteria make acid from sugar; basic toothpaste neutralises it. Acid rain has pH below 5.6 and harms aquatic life. Plants need a suitable soil pH. The stomach makes HCl for digestion, and antacids relieve excess acid. Nettle stings (methanoic acid) are relieved by dock plant leaves.`,`Antacid tablets neutralise excess stomach HCl.`,`The limit for acid rain is 5.6, not 7.`],'1.8':[`Salts are ionic compounds formed when an acid is neutralised by a base; salts with the same cation or anion form a family.`,`NaCl and Na₂SO₄ belong to the sodium family. Strong acid + strong base gives a neutral salt (pH 7), strong acid + weak base gives an acidic salt, and strong base + weak acid gives a basic salt. In the chlor-alkali process, electrolysis of brine gives NaOH, Cl₂ and H₂: 2NaCl + 2H₂O → 2NaOH + Cl₂ + H₂.`,`NaCl pH 7; Na₂CO₃ pH above 7; NH₄Cl pH below 7.`,`Chlorine forms at the anode and hydrogen at the cathode.`],'1.9':[`Baking soda, washing soda, bleaching powder and Plaster of Paris are useful chemicals prepared from common salt and lime.`,`Baking soda NaHCO₃ is a mild base used in antacids and baking; on heating, 2NaHCO₃ → Na₂CO₃ + H₂O + CO₂. Washing soda Na₂CO₃·10H₂O removes hardness of water. Bleaching powder CaOCl₂ is made from chlorine and dry slaked lime and used for bleaching and disinfecting. Plaster of Paris CaSO₄·½H₂O is made by heating gypsum at 373 K and sets into gypsum when mixed with water.`,`CaSO₄·½H₂O + 1½H₂O → CaSO₄·2H₂O.`,`Washing soda has 10 water molecules; Plaster of Paris has half a molecule.`]};

const G=[
[`1. Charge and current`,[
[`A current of 10 A flows for 2 minutes. Find the charge that passes and the number of electrons (e = 1.6 × 10⁻¹⁹ C).`,`t = 2 × 60 = 120 s. Charge Q = I × t = 10 × 120 = <b>1200 C</b>. Since Q = n × e, n = 1200 ÷ 1.6 × 10⁻¹⁹ = <b>7.5 × 10²¹ electrons</b>.`],
[`Define electric current and one ampere.`,`Current is the rate of flow of charge through a cross-section: I = Q/t. One ampere is the current when 1 coulomb passes a point every second (1 A = 1 C/s).`],
[`Name a device that maintains a potential difference across a conductor. How does it do this?`,`A cell or battery. The chemical reaction inside it creates a potential difference between its terminals and keeps it up while current flows through the conductor.`]]],
[`2. Ohm’s law and resistance`,[
[`State Ohm’s law.`,`At constant temperature, the potential difference V across a metallic conductor is directly proportional to the current I through it: V ∝ I, so <b>V = IR</b>, where R is the resistance.`],
[`What does a straight-line V–I graph tell you, and how do you read the resistance from it? Name the parts of the circuit used to plot it.`,`A straight line through the origin means V ∝ I, so the conductor obeys Ohm’s law (it is ohmic). The slope V/I gives R. Circuit: battery, plug key, rheostat and ammeter in series with the wire, with a voltmeter across the wire.`],
[`A graph gives I = 0, 1, 2, 3, 4 A at V = 0, 2, 4, 6, 8 V. Find I at 10 V and the resistance.`,`The line is straight, so I = V/2. At 10 V, <b>I = 5 A</b>. R = V/I = 10/5 = <b>2 Ω</b> (also 6 V ÷ 3 A between any two points).`],
[`Define resistance, its SI unit and 1 ohm. Give two features of the V–I graph of an ohmic conductor.`,`Resistance is a conductor’s opposition to the flow of charge. Unit: ohm (Ω). 1 Ω is the resistance across which 1 V drives 1 A. The graph is (i) a straight line through the origin and (ii) its slope gives the resistance.`]]],
[`3. Resistivity and factors`,[
[`Assertion (A): Metals and alloys are good conductors. Reason (R): Bronze, an alloy of copper and tin, is not a good conductor. Choose (a) both true and R explains A, (b) both true, R does not explain A, (c) A true, R false, (d) A false, R true.`,`<b>(c)</b>. A is true. R is false: bronze is an alloy of metals, so it also conducts well.`],
[`A conductor of length l and area A has resistance R. What area gives the same resistance for the same material at length 2l?`,`R = ρl/A. Doubling l doubles R unless A also doubles. So the area must be <b>2A</b>.`],
[`Assertion (A): Alloys are used in heaters and irons. Reason (R): Alloys have higher resistivity than their metals but lower melting points. Choose from (a) to (d) as above.`,`<b>(c)</b>. A is true. R is false: alloys do have higher resistivity, but they do not have lower melting points. They are used because of high resistivity and because they do not oxidise or burn easily when hot. (The key in your pasted text said (a); (c) is the correct choice.)`],
[`List the factors on which the resistance of a wire depends. Give the SI unit of resistivity.`,`Length (R ∝ l), area of cross-section (R ∝ 1/A) and the material (also temperature). Resistivity is measured in <b>Ω m</b>.`],
[`Why are metals good conductors and glass a poor one? Why are alloys used in heating devices?`,`Metals have very low resistivity; glass has extremely high resistivity. Alloys have higher resistivity than pure metals and do not oxidise or burn readily, so they heat well and last.`],
[`Find the resistance of a wire with l = 2 m, A = 1.55 × 10⁻⁶ m² and ρ = 2.8 × 10⁻⁸ Ω m.`,`R = ρl/A = (2.8 × 10⁻⁸ × 2) ÷ (1.55 × 10⁻⁶) = <b>0.036 Ω</b>.`],
[`Find the resistivity of a wire with l = 1 m, radius 0.01 cm and R = 20 Ω.`,`r = 10⁻⁴ m, so A = πr² = 3.14 × 10⁻⁸ m². ρ = RA/l = 20 × 3.14 × 10⁻⁸ ÷ 1 = <b>6.28 × 10⁻⁷ Ω m</b>.`],
[`A copper wire has diameter 0.5 mm and ρ = 1.6 × 10⁻⁸ Ω m. What length gives 100 Ω? What happens to R if the diameter is doubled?`,`A = π(0.25 × 10⁻³)² ≈ 1.96 × 10⁻⁷ m². l = RA/ρ ≈ <b>1.2 × 10³ m (about 1.2 km)</b>. Doubling the diameter makes the area 4 times, so R becomes 100 ÷ 4 = <b>25 Ω</b>.`],
[`A wire of radius 0.01 cm has R = 10 Ω and ρ = 50 × 10⁻⁸ Ω m. Find its length.`,`l = RA/ρ = (10 × 3.14 × 10⁻⁸) ÷ (5 × 10⁻⁷) = <b>0.628 m</b>.`],
[`A 16 Ω wire is melted and drawn into a wire of half the length. Find the new resistance and the percentage change.`,`Volume stays the same, so area doubles when length halves. R ∝ l/A, so R becomes ¼: <b>4 Ω</b>. Change = (16 − 4)/16 × 100 = <b>75% decrease</b>.`],
[`If the radius of a conductor is halved, how does the current through it change?`,`Area becomes ¼, so R becomes 4 times. At the same V, I = V/R falls to <b>one-fourth</b>.`],
[`Find the resistance of 50 cm of wire with A = 0.01 mm² and ρ = 5 × 10⁻⁸ Ω m. Which device changes resistance without changing the source voltage?`,`R = (5 × 10⁻⁸ × 0.5) ÷ (0.01 × 10⁻⁶) = <b>2.5 Ω</b>. The device is a <b>rheostat</b>.`]]],
[`4. Series and parallel`,[
[`What is the maximum resistance from five 15 Ω resistors? From four 2 Ω? From four 12 Ω?`,`Maximum comes from joining in series. <b>75 Ω</b>, <b>8 Ω</b> and <b>48 Ω</b> respectively. (The options in your pasted text were damaged.)`],
[`Derive the series and parallel formulas.`,`<b>Series:</b> same current I; V = V₁ + V₂ + V₃ = IR₁ + IR₂ + IR₃ and V = IRs, so Rs = R₁ + R₂ + R₃. <b>Parallel:</b> same voltage V; I = I₁ + I₂ + I₃ = V/R₁ + V/R₂ + V/R₃ and I = V/Rp, so 1/Rp = 1/R₁ + 1/R₂ + 1/R₃.`],
[`Find the equivalent resistance of 10 Ω, 15 Ω and 5 Ω in parallel.`,`1/R = 1/10 + 1/15 + 1/5 = (3 + 2 + 6)/30 = 11/30, so R = 30/11 ≈ <b>2.73 Ω</b>.`],
[`Give the advantages of connecting appliances in parallel instead of series.`,`Each appliance gets the full supply voltage; if one fails the others keep working; each draws the current it needs because the current divides according to resistance.`],
[`Using three 9 Ω resistors, how can you get (i) 13.5 Ω and (ii) 6 Ω?`,`(i) Two 9 Ω in parallel (4.5 Ω) in series with the third 9 Ω = 13.5 Ω. (ii) Two 9 Ω in series (18 Ω) in parallel with the third 9 Ω: (18 × 9)/(18 + 9) = 6 Ω.`],
[`A 3 V battery feeds three 3 Ω resistors: two in series, and that pair in parallel with the third. Find the current drawn.`,`Series pair = 6 Ω. With 3 Ω in parallel: (6 × 3)/9 = 2 Ω. I = V/R = 3/2 = <b>1.5 A</b>.`],
[`Two identical resistors are joined in series, then in parallel. Find the ratio of the equivalent resistances.`,`Series 2R, parallel R/2. Ratio = <b>4 : 1</b>.`],
[`(a) A 6 Ω wire is doubled on itself (folded). Find the new resistance. (b) Arrange three 2 Ω resistors to get 3 Ω.`,`(a) Folding halves the length and doubles the area, so R becomes ¼: <b>1.5 Ω</b>. (b) Two 2 Ω in parallel (1 Ω) in series with the third 2 Ω = <b>3 Ω</b>.`],
[`Three 2 V cells feed 10 Ω, 20 Ω and 30 Ω in parallel. Find each current, the total current and the equivalent resistance.`,`V = 6 V. Currents: 6/10 = <b>0.6 A</b>, 6/20 = <b>0.3 A</b>, 6/30 = <b>0.2 A</b>. Total = <b>1.1 A</b>. Req = 6/1.1 = 60/11 ≈ <b>5.45 Ω</b>.`],
[`3 Ω, 4 Ω and 6 Ω are in parallel across 6 V. Find Req and each current.`,`1/Req = 1/3 + 1/4 + 1/6 = 9/12, so Req = 4/3 ≈ <b>1.33 Ω</b>. Currents: 6/3 = <b>2 A</b>, 6/4 = <b>1.5 A</b>, 6/6 = <b>1 A</b>.`],
[`How can four 8 Ω resistors give a total of 8 Ω?`,`Make two series pairs (8 + 8 = 16 Ω each) and join the pairs in parallel: 16/2 = <b>8 Ω</b>.`],
[`Two wires have equal length and equal resistance, but ρ of A is greater than ρ of B. Which is thicker? Also, 30 Ω, 10 Ω and 5 Ω are in parallel across 6 V: find each current, the total current and Req.`,`R = ρl/A with equal l and R gives A ∝ ρ, so <b>wire A is thicker</b>. Currents: 0.2 A, 0.6 A, 1.2 A. Total <b>2 A</b>. Req = 6/2 = <b>3 Ω</b>.`],
[`Find the equivalent resistance of 6 Ω, 10 Ω and 15 Ω in parallel.`,`1/R = 1/6 + 1/10 + 1/15 = (5 + 3 + 2)/30 = 1/3, so <b>R = 3 Ω</b>.`],
[`A battery of five 2 V cells drives 5 Ω, 10 Ω and 15 Ω in series. Find the current and the potential difference across the 5 Ω resistor.`,`V = 10 V, R = 30 Ω, so I = 1/3 A ≈ <b>0.33 A</b>. V across 5 Ω = (1/3) × 5 = <b>5/3 ≈ 1.67 V</b>.`],
[`Two 12 Ω resistors are in parallel across 6 V. Find the current drawn.`,`Req = 6 Ω, so I = 6/6 = <b>1 A</b>.`],
[`How do you show that the current is the same everywhere in a series circuit? Give two precautions.`,`Move the ammeter to different positions in the series circuit; it reads the same each time. Precautions: keep connections neat and tight; connect the ammeter with correct polarity (positive terminal towards the battery’s positive side).`]]],
[`5. Heating effect of current`,[
[`If a resistor’s resistance is halved at the same voltage, how does its heating change?`,`H = V²t/R. Halving R doubles H: <b>two times</b>.`],
[`State Joule’s law. Find the heat when 96000 C passes in 2 hours through 40 V.`,`Heat H = I²Rt: proportional to I² (for fixed R), to R (for fixed I) and to time. Here H = VQ = 40 × 96000 = <b>3.84 × 10⁶ J (3.84 MJ)</b>.`],
[`What is the use of a fuse and what is the fuse wire made of?`,`A fuse protects circuits and appliances from excessive current. Its wire is a metal or alloy with a suitable low melting point; if the current is too high it heats up, melts and breaks the circuit.`],
[`Why is tungsten used for bulb filaments? Name two heating devices.`,`Tungsten has a very high melting point (about 3380 °C) and glows at around 2500 °C without melting. Heating devices: electric iron, heater, toaster.`],
[`A fuse wire melts at 5 A. Should a wire that melts at 10 A have a smaller or larger radius?`,`Heat = I²R, so for 10 A the resistance must be R/4. Since R ∝ 1/A, the area is 4 times, so the radius is 2 times: <b>larger</b>.`],
[`What is the heating effect of current? Name two appliances.`,`When electrical energy is dissipated as heat in a resistor, H = I²Rt. Examples: electric iron, toaster, kettle, geyser.`]]],
[`6. Power and energy`,[
[`Two bulbs (100 W and 40 W) are in series. The 100 W bulb carries 1 A. What does the 40 W bulb carry?`,`In series the current is the same: <b>1 A</b>.`],
[`Write the relation between R, P and V for a bulb filament.`,`P = V²/R, so <b>R = V²/P</b>.`],
[`A 60 W lamp runs for 1 s. How much energy does it use?`,`E = P × t = 60 × 1 = <b>60 J</b>.`],
[`A 100 W and a 60 W lamp (both 220 V) are in parallel on 220 V. Find the current drawn.`,`I₁ = 100/220 = 0.454 A; I₂ = 60/220 = 0.273 A. Total = <b>0.73 A</b>.`],
[`An iron has a hot element of 55 Ω on 220 V. Find the current and the wattage.`,`I = V/R = 220/55 = <b>4 A</b>. P = VI = 220 × 4 = <b>880 W</b>.`],
[`An iron is rated 750 W, 200 V. Find the current, the resistance and the energy used in 2 hours.`,`I = P/V = 3.75 A. R = V/I = 200/3.75 ≈ <b>53.3 Ω</b>. E = 750 W × 2 h = <b>1.5 kWh</b> = 5.4 × 10⁶ J.`],
[`A bulb on a 220 V generator draws 2.5 A. Find its power.`,`P = VI = 220 × 2.5 = <b>550 W</b>.`],
[`Define power. A torch bulb is rated 5 V, 500 mA. Find power, resistance and energy used in 2½ hours.`,`Power is the rate of consuming electrical energy (unit watt; P = VI = I²R = V²/R). P = 5 × 0.5 = <b>2.5 W</b>. R = 5/0.5 = <b>10 Ω</b>. E = 2.5 × 9000 s = <b>22500 J</b> = 6.25 Wh.`],
[`Two 15 Ω resistors are joined in series, then in parallel, across 6 V. Find the ratio of power.`,`Series: P = 36/30 = 1.2 W. Parallel: Req = 7.5 Ω, P = 36/7.5 = 4.8 W. Ratio = <b>1 : 4</b>.`],
[`A 20 Ω lamp and a 4 Ω conductor are in series with a 6 V battery. Find the total resistance, current, voltage across each and the lamp’s power.`,`R = 24 Ω. I = 6/24 = <b>0.25 A</b>. Lamp: 0.25 × 20 = <b>5 V</b>; conductor: 0.25 × 4 = <b>1 V</b>. Lamp power = I²R = 0.0625 × 20 = <b>1.25 W</b>.`],
[`A 40 W, 220 V bulb is replaced by 25 W, 220 V. Compare current and resistance.`,`40 W: I = 0.18 A, R = 220²/40 = 1210 Ω. 25 W: I = 0.11 A, R = 220²/25 = 1936 Ω. So <b>current falls and resistance rises</b>.`],
[`How should two resistors be joined for minimum power from a battery? Then: 3 bulbs of 100 W for 5 h, 2 fans of 50 W for 10 h and a 1 kW heater for ½ h each day. Find the 31-day energy and its cost at ₹3.60 per kWh.`,`Minimum power needs minimum current, so join them in <b>series</b>. Daily: bulbs 0.3 kW × 5 = 1.5 kWh; fans 0.1 kW × 10 = 1 kWh; heater 1 × 0.5 = 0.5 kWh; total 3 kWh. Month: 3 × 31 = <b>93 kWh</b>. Cost = 93 × 3.60 = <b>₹334.80</b>.`],
[`A bulb draws 0.5 A on 220 V. A 400 W fridge runs 8 h a day. Difference between kW and kWh?`,`Bulb: P = 220 × 0.5 = <b>110 W</b>. Fridge: 0.4 kW × 8 h = <b>3.2 kWh</b> per day. The kilowatt is a unit of power; the kilowatt-hour is a unit of energy. 1 kWh = 3.6 × 10⁶ J.`]]]];
